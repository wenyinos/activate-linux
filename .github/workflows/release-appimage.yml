name: Release AppImage

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev \
            libxi-dev libx11-dev x11proto-core-dev x11proto-dev \
            libxt-dev libxext-dev libxfixes-dev libxinerama-dev libxrandr-dev \
            libwayland-dev wayland-protocols libconfig-dev

      - name: Build
        run: make

      - name: Build AppImage
        run: make appimage

      - name: Upload AppImage to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            activate-linux-${{ matrix.arch }}.AppImage \
            --clobber

      - name: Upload artifact (manual test runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: activate-linux-${{ matrix.arch }}.AppImage
